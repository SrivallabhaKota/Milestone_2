{% extends "base.html" %}
{% block title %}Create Account — FinGoal{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <div class="auth-logo">
    <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
    <span class="auth-logo-text">FinGoal</span>
  </div>

  <h1 class="auth-title">Create your account</h1>
  <p class="auth-subtitle">Start planning your financial goals today</p>

  <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
    <div class="form-group">
      <label class="form-label" for="name">Full Name <span>*</span></label>
      <input type="text" id="name" name="name" class="form-control"
             placeholder="Your full name" required
             value="{{ name or '' }}" autocomplete="name" />
    </div>
    <div class="form-group">
      <label class="form-label" for="email">Email Address <span>*</span></label>
      <input type="email" id="email" name="email" class="form-control"
             placeholder="you@example.com" required
             value="{{ email or '' }}" autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label" for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" class="form-control"
             placeholder="+91 99999 99999"
             value="{{ phone or '' }}" autocomplete="tel" />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="password">Password <span>*</span></label>
        <input type="password" id="password" name="password" class="form-control"
               placeholder="Min. 6 characters" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password <span>*</span></label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control"
               placeholder="Re-enter password" required autocomplete="new-password" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg">
      <i class="fas fa-user-plus"></i> Create Account
    </button>
  </form>

  <div class="auth-footer">
    Already have an account?
    <a href="{{ url_for('auth.login') }}" style="font-weight:600;">Sign in</a>
  </div>
</div>
{% endblock %}
